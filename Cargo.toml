[workspace]
resolver = "2"
members = [
    "crates/probe-domain",
    "crates/probe-config",
    "crates/probe-dns",
    "crates/probe-storage",
    "crates/probe-source",
    "crates/probe-mihomo",
    "crates/probe-substore",
    "crates/probe-engine",
    "crates/probe-api",
    "crates/probe-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

# The dependency direction is one-way (GLM_5.3_Flash §3):
#   probe-domain <- config/dns/mihomo/substore/storage <- engine <- api/scheduler/cli
# probe-domain must never depend on web, database or network-client crates.

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: Python's json.dumps emits proxy dicts in document order,
# and the generated kernel config must diff byte-for-byte against it during
# shadow runs -- sorted keys would make every line differ for no reason.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "fs",
    # probe-engine's layered gate needs Semaphore; tests need time::timeout
    # and time::sleep to prove the gate is not deadlocking.
    "sync",
    "time",
    # probe-source's Sub-Store admin tests stub the HTTP API on a raw
    # TcpListener; io-util is the read/write extension traits it uses.
    "net",
    "io-util",
] }
# CancellationToken is the maintained answer to "stop this round"; hand-rolling
# an AtomicBool would lose the wake-on-cancel that a blocked acquire needs.
# `tokio_util::sync` is not feature-gated in 0.7, so no features are enabled.
tokio-util = "0.7"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
# ADR-0001 (workstreams/08): bundled so the build is reproducible on hosts
# without a system libsqlite (this repo's dev machine is Windows); sqlx is
# re-evaluated when the R2 migration framework lands.
rusqlite = { version = "0.32", features = ["bundled"] }
# probe-source parses Sub-Store's ClashMeta output. See its `subscription`
# module for the YAML-1.1-vs-1.2 caveat against PyYAML.
serde_yaml = "0.9"
# Node identity: sha256 of the canonical connection-parameter JSON, first 8
# bytes. Must match `mihomo_test.core.fingerprint_proxy` byte for byte.
sha2 = "0.10"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "macros"] }
getrandom = "0.3"

[profile.test]
# sqlite3.c is the slow part of a cold build; keep it out of debug bloat.
opt-level = 0
