name: ci

# Quality gate (GLM_5.3_Flash §17): formatting, static checks, tests and the
# secret scan must pass before anything builds a release artifact. The Python
# suite stays the compatibility baseline until the full migration lands.

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime deps
        run: pip install PyYAML==6.0.3
      - name: Syntax check
        run: python -m py_compile mihomo_test/*.py tools/scan_secrets.py
      - name: Test suite (baseline)
        run: python -m unittest discover -s tests -v
      - name: Secret scan
        run: python tools/scan_secrets.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, not @stable: a floating toolchain let a new clippy lint turn this
      # job red while the dev box stayed green (three failed pushes, 2026-10-05).
      # Keep in step with rust-toolchain.toml at the repo root.
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests (locked, all features)
        run: cargo test --workspace --locked --all-features
      - name: Secret scan
        run: python tools/scan_secrets.py
      - name: Supply chain - licenses
        run: python tools/license_check.py
      - name: Supply chain - dependency policy
        run: python tools/dependency_policy.py
      - name: Supply chain - advisories
        uses: taiki-e/install-action@cargo-audit
      - name: Advisories (RustSec)
        run: cargo audit
      - name: Supply chain - SBOM (CycloneDX)
        run: python tools/sbom.py --output sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error