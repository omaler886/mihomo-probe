[package]
name = "probe-publish"
version.workspace = true
edition.workspace = true

[dependencies]
# `GistSection`/`PublishProvider` come from the config crate; the publisher
# never reads config.json itself (the caller owns that).
probe-config = { path = "../probe-config" }
reqwest = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
# RFC3339 timestamps for the manifest entries (`formatting` is already on in
# the workspace dependency).
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The Gist publisher tests stub api.github.com on a real listener, the same
# way probe-source's SubAdmin tests stub the Sub-Store admin API: the request
# sequence (GET -> PATCH, retries, Retry-After) is the behaviour under test.
axum = { workspace = true }
tempfile = "3"
