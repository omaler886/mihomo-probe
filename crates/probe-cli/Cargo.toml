[package]
name = "probe-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "probe-cli"
path = "src/main.rs"

[dependencies]
probe-api = { path = "../probe-api" }
probe-config = { path = "../probe-config" }
probe-domain = { path = "../probe-domain" }
probe-engine = { path = "../probe-engine" }
probe-mihomo = { path = "../probe-mihomo" }
probe-publish = { path = "../probe-publish" }
probe-source = { path = "../probe-source" }
probe-storage = { path = "../probe-storage" }
probe-substore = { path = "../probe-substore" }
# The agent subcommand serves POST /jobs (workstreams/31) — a runtime need.
axum = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
# The migrate tests stub the Sub-Store backend with a loopback axum server
# (already in the workspace lock; no new dependency enters it).
axum = { workspace = true }
