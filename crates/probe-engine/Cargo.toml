[package]
name = "probe-engine"
version.workspace = true
edition.workspace = true

[dependencies]
probe-domain = { path = "../probe-domain" }
probe-config = { path = "../probe-config" }
probe-dns = { path = "../probe-dns" }
# workstreams/02 dependency order: domain <- mihomo/storage <- engine <- api/cli.
# The engine decides *what* runs and *how much at once*; the kernel adapter and
# the ledger arrive through traits, so tests need neither a kernel nor a file.
probe-mihomo = { path = "../probe-mihomo" }
probe-source = { path = "../probe-source" }
probe-storage = { path = "../probe-storage" }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The round lock touches a real filesystem; a temp dir is the honest fixture
# for it, the same way probe-cli tests its database commands.
tempfile = "3"
